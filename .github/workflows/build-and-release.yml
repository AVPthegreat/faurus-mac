name: Build and Release Faurus Exam Browser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS Release
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Release App
        run: |
          xcodebuild -workspace SafeExamBrowser.xcworkspace \
                     -scheme "Safe Exam Browser" \
                     -configuration Release \
                     -derivedDataPath DerivedData \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=YES \
                     build

      - name: Package ZIP and DMG
        run: |
          mkdir -p dist
          APP_PATH="DerivedData/Build/Products/Release/Faurus Exam Browser.app"

          # Create ZIP
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/Faurus-Exam-Browser.zip"

          # Create DMG
          TEMP_DMG="dist/temp_dmg"
          mkdir -p "$TEMP_DMG"
          cp -R "$APP_PATH" "$TEMP_DMG/"
          ln -s /Applications "$TEMP_DMG/Applications"

          hdiutil create -volname "Faurus Exam Browser" \
                         -srcfolder "$TEMP_DMG" \
                         -ov -format UDZO \
                         "dist/Faurus-Exam-Browser.dmg"
          rm -rf "$TEMP_DMG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Faurus Exam Browser ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/Faurus-Exam-Browser.zip
            dist/Faurus-Exam-Browser.dmg
            install-mac.sh
